name: Release

# Cut by `make release VERSION=x.y.z` (scripts/release.sh), which pushes a
# vX.Y.Z tag. This builds the cross-platform binaries via GoReleaser
# (src/.goreleaser.yaml), publishes the GitHub Release with the archives +
# checksums, pushes the multi-arch container image to ghcr.io and the Homebrew
# cask to jfigge/homebrew-tap, then dispatches the Deploy site workflow so the
# Downloads page (website/versions.json) picks up the new release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # dispatch the deploy-site workflow after publishing
      packages: write # push container images to ghcr.io/jfigge/keephippo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser needs full history + tags for the changelog
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod
          cache: true
          cache-dependency-path: src/go.sum

      # Multi-arch container images: QEMU emulates linux/arm64 on the amd64
      # runner, buildx is the builder GoReleaser drives, and the login lets it
      # push to ghcr.io using the workflow's GITHUB_TOKEN (packages:write above).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Runs from src/ so it finds .goreleaser.yaml there; artifacts land in dist/.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          # Pinned exactly (not "~> v2") so a GoReleaser release can't change
          # what a tag builds. Keep in sync with GORELEASER_VERSION in Makefile.
          version: "v2.17.1"
          args: release --clean
          workdir: src
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing (quill) — signs the darwin binaries on this Linux
          # runner. Signing is skipped automatically if these are unset.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          # Notarization (used once the notarize block is enabled + issuer is set).
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          # Homebrew tap push — skipped (formula still built) when unset.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # Scoop bucket push — skipped (manifest still built) when unset.
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}

      - name: Refresh Downloads page (versions.json tracks the new release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-site.yml --ref main
