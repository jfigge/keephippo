name: CI

on:
  push:
    branches: [main, release]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: fmt · lint · test · build · vuln
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod
          check-latest: true
          cache: true
          cache-dependency-path: src/go.sum

      # Versions are pinned in the Makefile (GOFUMPT_VERSION etc.) so CI and
      # local dev run byte-identical tools — bump them there, not here.
      - name: Install tools
        run: |
          make tools
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: fmt-check
        run: make fmt-check

      - name: lint
        run: make lint

      - name: test
        run: make test

      - name: build
        run: make build

      - name: vuln
        run: make vuln
