name: CI

on:
  push:
    branches: [main, release]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: fmt · lint · test · build · vuln
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: src/go.mod
          check-latest: true
          cache: true
          cache-dependency-path: src/go.sum

      # Versions are pinned in the Makefile (GOFUMPT_VERSION etc.) so CI and
      # local dev run byte-identical tools — bump them there, not here.
      - name: Install tools
        run: |
          make tools
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: fmt-check
        run: make fmt-check

      - name: lint
        run: make lint

      - name: test
        run: make test

      - name: build
        run: make build

      - name: vuln
        run: make vuln
